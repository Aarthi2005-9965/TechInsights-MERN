
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechInsights - Admin Dashboard</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f3f5fa;
  color: #222;
}

header {
  background: #172554;
  color: white;
  padding: 22px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

header h2 { font-size: 23px; }

button {
  border: none;
  padding: 11px 17px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.logout { background: #ef4444; color: white; }

.container {
  max-width: 1100px;
  margin: 35px auto;
  padding: 0 20px;
}

.panel {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #00000010;
  margin-bottom: 25px;
}

h2 { margin-bottom: 20px; }

input, textarea, select {
  width: 100%;
  padding: 13px;
  margin: 8px 0 16px;
  border: 1px solid #ccd2df;
  border-radius: 6px;
  font-size: 15px;
}

textarea { min-height: 110px; resize: vertical; }

.primary {
  background: #2563eb;
  color: white;
}

.cancel {
  background: #64748b;
  color: white;
  margin-left: 8px;
}

#dashboard { display: none; }
#loginSection { max-width: 450px; margin: 70px auto; }

.blog {
  border: 1px solid #e1e5ed;
  padding: 18px;
  border-radius: 9px;
  margin-top: 15px;
}

.blog h3 { color: #1d4ed8; margin-bottom: 8px; }

.blog p { margin: 7px 0; line-height: 1.5; }

.edit { background: #f59e0b; color: white; }
.delete { background: #dc2626; color: white; margin-left: 7px; }

#message { margin-top: 15px; font-weight: bold; }
.small { color: #64748b; font-size: 13px; }

@media(max-width:600px) {
  header { padding: 18px; }
  header h2 { font-size: 18px; }
  .panel { padding: 17px; }
}
</style>
</head>

<body>

<header>
  <h2>TechInsights Admin</h2>
  <button class="logout" id="logoutBtn" onclick="logout()" style="display:none">Logout</button>
</header>

<section id="loginSection" class="panel">
  <h2>Admin Login</h2>

  <form id="loginForm">
    <label>Username</label>
    <input id="username" type="text" placeholder="Enter username" required>

    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password" required>

    <button class="primary" type="submit">Login</button>
  </form>

  <p id="loginMessage"></p>
</section>

<main class="container" id="dashboard">

  <section class="panel">
    <h2 id="formTitle">Add New Blog</h2>

    <form id="blogForm">
      <label>Blog Title</label>
      <input id="title" type="text" placeholder="Enter blog title" required>

      <label>Category</label>
      <input id="category" type="text" placeholder="Technology, AI, Web Development..." required>

      <label>Description</label>
      <textarea id="description" placeholder="Short description" required></textarea>

      <label>Content</label>
      <textarea id="content" placeholder="Write your blog content" required></textarea>

      <label>Image URL (optional)</label>
      <input id="image" type="text" placeholder="Enter image URL">

      <button class="primary" type="submit" id="saveBtn">Add Blog</button>
      <button class="cancel" type="button" id="cancelBtn" onclick="resetForm()" style="display:none">Cancel Edit</button>
    </form>

    <p id="message"></p>
  </section>

  <section class="panel">
    <h2>Manage Blogs</h2>
    <p class="small">View, edit and delete published blog posts.</p>
    <div id="blogList">Loading blogs...</div>
  </section>

</main>

<script>
const API = "http://localhost:5000/api";
let token = "";
let editingId = null;

const loginSection = document.getElementById("loginSection");
const dashboard = document.getElementById("dashboard");
const loginMessage = document.getElementById("loginMessage");
const message = document.getElementById("message");
const blogList = document.getElementById("blogList");

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  try {
    const response = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.message || "Login failed");

    token = data.token;
    loginSection.style.display = "none";
    dashboard.style.display = "block";
    document.getElementById("logoutBtn").style.display = "block";

    loadBlogs();
  } catch (error) {
    loginMessage.textContent = error.message;
    loginMessage.style.color = "red";
  }
});

async function loadBlogs() {
  blogList.textContent = "Loading blogs...";

  try {
    const response = await fetch(`${API}/blogs`);
    const blogs = await response.json();

    if (!response.ok) throw new Error("Unable to load blogs");

    blogList.innerHTML = "";

    if (!blogs.length) {
      blogList.textContent = "No blogs found. Add your first blog!";
      return;
    }

    blogs.forEach(blog => {
      const item = document.createElement("div");
      item.className = "blog";

      const heading = document.createElement("h3");
      heading.textContent = blog.title;

      const category = document.createElement("p");
      category.textContent = "Category: " + blog.category;

      const description = document.createElement("p");
      description.textContent = blog.description;

      const editButton = document.createElement("button");
      editButton.className = "edit";
      editButton.textContent = "Edit";
      editButton.onclick = () => editBlog(blog);

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete";
      deleteButton.textContent = "Delete";
      deleteButton.onclick = () => deleteBlog(blog._id);

      item.append(heading, category, description, editButton, deleteButton);
      blogList.appendChild(item);
    });

  } catch (error) {
    blogList.textContent = error.message;
  }
}

document.getElementById("blogForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const blog = {
    title: document.getElementById("title").value,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value,
    content: document.getElementById("content").value,
    image: document.getElementById("image").value
  };

  const url = editingId
    ? `${API}/blogs/${editingId}`
    : `${API}/blogs`;

  const method = editingId ? "PUT" : "POST";

  try {
    const response = await fetch(url, {
      method,
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(blog)
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.message || "Unable to save blog");

    message.textContent = editingId ? "Blog updated successfully!" : "Blog added successfully!";
    message.style.color = "green";

    resetForm();
    loadBlogs();

  } catch (error) {
    message.textContent = error.message;
    message.style.color = "red";
  }
});

function editBlog(blog) {
  editingId = blog._id;

  document.getElementById("title").value = blog.title;
  document.getElementById("category").value = blog.category;
  document.getElementById("description").value = blog.description;
  document.getElementById("content").value = blog.content;
  document.getElementById("image").value = blog.image || "";

  document.getElementById("formTitle").textContent = "Edit Blog";
  document.getElementById("saveBtn").textContent = "Update Blog";
  document.getElementById("cancelBtn").style.display = "inline-block";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteBlog(id) {
  if (!confirm("Are you sure you want to delete this blog?")) return;

  try {
    const response = await fetch(`${API}/blogs/${id}`, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${token}` }
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.message || "Delete failed");

    message.textContent = "Blog deleted successfully!";
    message.style.color = "green";
    loadBlogs();

  } catch (error) {
    message.textContent = error.message;
    message.style.color = "red";
  }
}

function resetForm() {
  document.getElementById("blogForm").reset();
  editingId = null;

  document.getElementById("formTitle").textContent = "Add New Blog";
  document.getElementById("saveBtn").textContent = "Add Blog";
  document.getElementById("cancelBtn").style.display = "none";
}

function logout() {
  token = "";
  dashboard.style.display = "none";
  loginSection.style.display = "block";
  document.getElementById("logoutBtn").style.display = "none";
  document.getElementById("loginForm").reset();
  resetForm();
}
</script>

</body>
</html>
